name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build verification — always runs on GitHub's cloud runner
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build Check (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  # ─────────────────────────────────────────────────────────────
  # Job 2: Production deploy — runs on self-hosted runner (sim-iku)
  # ─────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production (sim-iku)
    runs-on:
      group: sim-iku
      labels: [sim-iku]
    environment: production

    steps:
      - name: Extract PR number
        id: pr
        run: |
          PR_NUMBER=$(echo "${{ github.event.head_commit.message }}" \
            | grep -oP '(?<=Merge pull request #)\d+' || echo "")
          echo "number=${PR_NUMBER:-${GITHUB_SHA:0:7}}" >> $GITHUB_OUTPUT

      - name: Notify - Deployment Started
        if: vars.TELEGRAM_NOTIFY == 'true'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "{\"chat_id\":\"${{ secrets.TELEGRAM_CHAT_ID }}\",\"text\":\"Deploy started: sim-iku-frontend #${{ steps.pr.outputs.number }}\"}"

      - name: Fetch latest code
        run: |
          mkdir -p /webdata/sim-iku/frontend
          GIT_CRED='!f() { echo username=x-access-token; echo password=${{ secrets.GITHUB_TOKEN }}; }; f'
          if [ ! -d "/webdata/sim-iku/frontend/.git" ]; then
            git init /webdata/sim-iku/frontend
            git -C /webdata/sim-iku/frontend remote add origin https://github.com/ppns-id/sim-iku-frontend.git
          fi
          git -C /webdata/sim-iku/frontend -c credential.helper="$GIT_CRED" fetch origin main

      - name: Apply latest code
        run: git -C /webdata/sim-iku/frontend reset --hard origin/main

      - name: Gather build info
        id: build_info
        run: |
          RAW=$(git -C /webdata/sim-iku/frontend log ${{ github.event.before }}..${{ github.sha }} \
            --pretty="%h %s - %an" 2>/dev/null)
          if [ -z "$RAW" ]; then
            RAW=$(git -C /webdata/sim-iku/frontend log -5 --pretty="%h %s - %an")
          fi
          CHANGES=$(echo "$RAW" | sed 's/^/• /')
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Build frontend image
        working-directory: /webdata/sim-iku/frontend
        env:
          CACHE_BUST: ${{ github.sha }}
        run: docker compose -f docker-compose.prod.yml build frontend

      - name: Deploy frontend service
        working-directory: /webdata/sim-iku/frontend
        run: docker compose -f docker-compose.prod.yml up -d --no-deps frontend

      - name: Clean up old Docker images
        run: docker image prune -f

      - name: Verify deployment
        working-directory: /webdata/sim-iku/frontend
        run: |
          sleep 10
          docker compose -f docker-compose.prod.yml ps

      - name: Notify - Deployment Succeeded
        if: success() && vars.TELEGRAM_NOTIFY == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHANGES: ${{ steps.build_info.outputs.changes }}
        run: |
          {
            echo "sim-iku-frontend #${PR_NUMBER} deployed"
            echo ""
            echo "Changes:"
            echo "${CHANGES}"
          } | jq -Rs "{chat_id:\"${{ secrets.TELEGRAM_CHAT_ID }}\",text:.}" \
            | curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -H "Content-Type: application/json" \
                -d @-

      - name: Notify - Deployment Failed
        if: failure() && vars.TELEGRAM_NOTIFY == 'true'
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          CHANGES: ${{ steps.build_info.outputs.changes }}
        run: |
          {
            echo "sim-iku-frontend #${PR_NUMBER} FAILED"
            echo ""
            echo "Changes:"
            echo "${CHANGES}"
          } | jq -Rs "{chat_id:\"${{ secrets.TELEGRAM_CHAT_ID }}\",text:.}" \
            | curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
                -H "Content-Type: application/json" \
                -d @-
